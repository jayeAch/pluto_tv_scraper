name: Pluto TV Data Updater

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # ← allows manual test

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Don't try to push back on PRs (checkout is a merge ref, not writable)
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci

      - name: Generate Pluto TV files
        run: node index 2>&1 | tee generation.log

      - name: Diagnose — show everything that was generated
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== Any m3u8/xml under repo (excluding node_modules) ==="
          find . -path ./node_modules -prune -o \( -name '*.m3u8' -o -name '*.xml' \) -print || true
          echo "=== Playlists dir (if it exists) ==="
          ls -la playlists/ 2>/dev/null || echo "(no playlists/ yet)"

      - name: Move generated files to playlists/
        run: |
          mkdir -p playlists
          shopt -s nullglob

          moved=0

          # 1) move anything matching plutotv_* from the repo root
          root_files=(plutotv_*.m3u8 plutotv_*.xml)
          if [ ${#root_files[@]} -gt 0 ]; then
            echo "Moving from repo root: ${root_files[*]}"
            mv "${root_files[@]}" playlists/
            moved=1
          fi

          # 2) if index wrote to common subdirs, pick them up too
          for d in output out data dist build generated; do
            if [ -d "$d" ]; then
              sub=( "$d"/plutotv_*.m3u8 "$d"/plutotv_*.xml )
              if [ ${#sub[@]} -gt 0 ]; then
                echo "Moving from $d/: ${sub[*]}"
                mv "${sub[@]}" playlists/
                moved=1
              fi
            fi
          done

          # 3) sanity check: did we end up with files in playlists/?
          if ! ls playlists/plutotv_* >/dev/null 2>&1; then
            echo "ERROR: no plutotv_* files ended up in playlists/"
            echo "Check the 'Diagnose' step above to see what index actually produced."
            exit 1
          fi

          echo "=== playlists/ now contains ==="
          ls -la playlists/

      - name: Filter EPG XML to M3U channels only
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const dir = './playlists';

          const m3uFiles = fs.readdirSync(dir).filter(f => f.startsWith('plutotv_') && f.endsWith('.m3u8'));
          const xmlFiles = fs.readdirSync(dir).filter(f => f.startsWith('plutotv_') && f.endsWith('.xml'));
          if (!m3uFiles.length || !xmlFiles.length) {
            console.error('Missing plutotv_*.m3u8 or plutotv_*.xml in ./playlists');
            process.exit(1);
          }

          // collect every tvg-id from the m3u8 files
          const ids = new Set();
          for (const f of m3uFiles) {
            for (const line of fs.readFileSync(`${dir}/${f}`, 'utf8').split('\n')) {
              const m = line.match(/tvg-id="([^"]+)"/);
              if (m && m[1].trim()) ids.add(m[1].trim());
            }
          }
          console.log(`Found ${ids.size} unique tvg-ids across ${m3uFiles.length} M3U file(s)`);
          if (ids.size === 0) {
            console.error('No tvg-ids found - aborting to avoid producing empty XML');
            process.exit(1);
          }

          // filter each xml in place
          for (const f of xmlFiles) {
            const raw = fs.readFileSync(`${dir}/${f}`, 'utf8');
            const filtered = raw
              .replace(/<channel [^>]*id="([^"]+)"[^>]*>[\s\S]*?<\/channel>/g, (b, id) => ids.has(id.trim()) ? b : '')
              .replace(/<programme [^>]*channel="([^"]+)"[^>]*>[\s\S]*?<\/programme>/g, (b, ch) => ids.has(ch.trim()) ? b : '');
            fs.writeFileSync(`${dir}/${f}`, filtered, 'utf8');
            console.log(`${f}: channels ${(raw.match(/<channel /g)||[]).length} -> ${(filtered.match(/<channel /g)||[]).length} | programmes ${(raw.match(/<programme /g)||[]).length} -> ${(filtered.match(/<programme /g)||[]).length}`);
          }
          EOF

      - name: Commit and push to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f playlists/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git status
            git commit -m "chore: update Pluto TV playlists & EPG [skip ci]"
            # Explicit refspec so it works on schedule / workflow_dispatch too
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Pluto TV Data
          body: "Auto-generated Pluto TV playlists & EPG (updated ${{ github.event.repository.updated_at }})"
          files: |
            playlists/plutotv_*.m3u8
            playlists/plutotv_*.xml
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
